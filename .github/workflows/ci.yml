name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Cancel obsolete pull-request work while allowing every main-branch push to
# produce its own immutable result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.91.0
          components: clippy,rustfmt
          cache-shared-key: pool-rust-1.91.0
          cache-on-failure: true
          # Pull requests restore main's cache but cannot consume the repository
          # cache allowance with branch-local entries.
          cache-save-if: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check every target and feature
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Lint every target and feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build warning-free API documentation
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  tests:
    name: Deterministic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.91.0
          cache-shared-key: pool-rust-1.91.0
          cache-on-failure: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      # Required CI is deliberately hermetic: it must not contact live Wcash or
      # Zcash nodes, solve Equihash, depend on wall-clock timing, or use funds.
      - name: Run deterministic workspace tests
        run: cargo test --locked --workspace --all-targets --all-features

  supply-chain:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check advisories, licenses, sources, and bans
        uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2.0.18
        with:
          command: check advisories bans licenses sources
          arguments: --workspace --all-features --locked

  workflow-security:
    name: GitHub Actions policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # zizmor online audits inspect repository Actions metadata.
      contents: read
      security-events: write # The pinned action uploads its SARIF result through CodeQL.
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          version: 1.25.2
